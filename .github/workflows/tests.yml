name: tests

on:
  push:
    branches: ['**']     # a push that changes VERSION also runs them through release.yml
  pull_request:
  workflow_call:         # release.yml gates a release on this suite
    inputs:
      macos:
        description: 'also run on macOS (a release does)'
        type: boolean
        default: false

jobs:
  lint:
    # Static analysis: its verdict does not differ per platform, so Ubuntu only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: TypeScript (tsc --noEmit)
        run: npm ci --no-audit --no-fund && npx tsc --noEmit
      - name: syntax (bash -n, node --check)
        run: |
          for f in bin/* install.sh lib/install.sh shims/scripts/*.sh shims/scripts/hooks/*.sh tools/*.sh; do
            bash -n "$f" || exit 1
          done
          node --check src/launch.mjs
      - name: shellcheck
        # Policy (intentional-pattern exclusions, with reasons): .shellcheckrc
        run: shellcheck -x bin/* install.sh lib/install.sh shims/scripts/*.sh shims/scripts/hooks/*.sh tools/*.sh

  matrix:
    # The OS list: Linux and Windows always, macOS too when the caller asks (release.yml).
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.os.outputs.os }}
    steps:
      - id: os
        run: |
          if [ "${{ inputs.macos }}" = true ]; then
            echo 'os=["ubuntu-latest","windows-latest","macos-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.matrix.outputs.os) }}
        shard: [ts-a, ts-b, ts-c, ts-d, ts-e, node-a, node-b, os]   # the file groups are in tests/shards.json
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags: install.test.ts installs the real v0.10.0 / v0.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24   # the commands run src/*.ts by type stripping
      - name: git settings
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          git config --global core.longpaths true
      - run: npm ci --no-audit --no-fund
      - name: versions
        run: |
          node --version
          npm --version
          bash --version | head -1
          git --version
      - name: GSD (gsd-core) for the end-to-end and OS suites
        run: npm install -g --no-audit --no-fund @opengsd/gsd-core@1.18.0
      - name: a browser for the UI check suite
        # The runner behind `gsdt-ui check` is only tested when it drives a real
        # browser: a pinned Playwright and its Chromium, outside the checkout.
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          printf '{"name":"pw","private":true}\n' > package.json
          npm install --no-audit --no-fund playwright@1.63.0
          if [ "$RUNNER_OS" = Linux ]; then npx playwright install --with-deps chromium; else npx playwright install chromium; fi
      - name: tests (node --test, shard ${{ matrix.shard }})
        timeout-minutes: ${{ matrix.shard == 'ts-c' && matrix.os == 'windows-latest' && 14 || 30 }}   # a hang ends here with its log kept, not at the job's 40
        env:
          GSD_TEST_REQUIRE_GSD: 1       # a skip here would mean an untested claim path
          GSD_TEST_REQUIRE_BROWSER: 1   # a skip here would mean an untested checker
          GSD_TEST_MAX_FAILS: 15        # tests/bail-reporter.mjs stops the run after this many failed tests
          SHARD: ${{ matrix.shard }}
        run: |
          export GSD_PLAYWRIGHT_ROOT="$RUNNER_TEMP/pw"
          FILES=$(node -e "console.log(require('./tests/shards.json')[process.env.SHARD].join(' '))")
          PRE=
          if [ "$RUNNER_OS" = Windows ]; then PRE="--import ./tests/win-preload.ts"; fi
          # shellcheck disable=SC2086
          node --test $PRE --test-reporter=tap --test-reporter-destination=stdout --test-reporter=./tests/bail-reporter.mjs --test-reporter-destination=stderr --test-timeout=120000 $FILES
